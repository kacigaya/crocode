services:
  postgres:
    image: postgres:17
    # Each service gets only the variables it reads. Docker Compose reads
    # .env for ${...} interpolation.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: crocode:latest
    command: [api]
    # No agent credentials: the API never runs agents.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Empty GitHub values use the app from dashboard setup in /config.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      CROCODE_CONFIG_DIR: /config
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_WEB_URL: ${GITHUB_WEB_URL:-https://github.com}
      CROCODE_BIND: ${CROCODE_BIND:-0.0.0.0:8080}
      CROCODE_AGENTS: ${CROCODE_AGENTS:-claude,opencode}
      CROCODE_DEFAULT_AGENT: ${CROCODE_DEFAULT_AGENT:-claude}
      CROCODE_FALLBACK_AGENT: ${CROCODE_FALLBACK_AGENT:-}
      CROCODE_LOG_FORMAT: ${CROCODE_LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - crocode-config:/config:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    image: crocode:latest
    command: [worker]
    # The worker needs agent credentials and any names in CROCODE_AGENT_ENV.
    # It passes only named variables into sandbox containers.
    env_file: .env
    environment:
      CROCODE_CONFIG_DIR: /config
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - crocode-config:/config:ro
      - type: bind
        source: ${CROCODE_WORK_DIR:-/var/lib/crocode/work}
        target: ${CROCODE_WORK_DIR:-/var/lib/crocode/work}
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    profiles: [dashboard]
    build: ./web
    # Dashboard secrets live in web/.env, apart from the backend secrets.
    env_file:
      - path: web/.env
        required: false
    environment:
      CROCODE_API_URL: http://api:8080
      CROCODE_CONFIG_DIR: /config
    volumes:
      - crocode-config:/config
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  # GitHub App credentials from first-run setup.
  crocode-config:
