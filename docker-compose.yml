services:
  postgres:
    image: postgres:17
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: crocode:latest
    command: [api]
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    image: crocode:latest
    command: [worker]
    env_file: .env
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${CROCODE_WORK_DIR:-/var/lib/crocode/work}
        target: ${CROCODE_WORK_DIR:-/var/lib/crocode/work}
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  # The dashboard branch supplies web/Dockerfile.
  web:
    profiles: [dashboard]
    build: ./web
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
